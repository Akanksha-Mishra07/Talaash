<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tailor.css">
</head>
<body>
    <div class="container">
        <form class="signup-form">
            <h2>Sign Up</h2>
            <label for="shop-name">Shop Name</label>
            <input type="text" id="shop-name" name="shop-name" required>

            <label for="city">City</label>
            <select id="city" name="city" required>
                <option value="mumbai">Mumbai</option>
                <option value="delhi">Delhi</option>
                <option value="bangalore">Bangalore</option>
                <option value="hyderabad">Hyderabad</option>
                <option value="ahmedabad">Ahmedabad</option>
                <option value="chennai">Chennai</option>
                <option value="kolkata">Kolkata</option>
                <option value="pune">Pune</option>
                <option value="jaipur">Jaipur</option>
                <option value="lucknow">Lucknow</option>
            </select>

            <label for="shop-address">Shop Address</label>
            <input type="text" id="shop-address" name="shop-address" required>

        

            <label for="contact-number">Contact Number</label>
            <input type="tel" id="contact-number" name="contact-number" pattern="[0-9]{10}" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="annual-income">What is your annual income?</label>
            <select id="annual-income" name="annual-income" required>
                <option value="less-than-2-lakhs">Less than 2 lakhs</option>
                <option value="less-than-5-lakhs">Less than 5 lakhs</option>
                <option value="less-than-10-lakhs">Less than 10 lakhs</option>
            </select>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
